   <g id="text_2">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="195.42" y="198.377703" transform="rotate(-0 195.42 198.377703)">限制可见位置</text>
   </g>
   <g id="text_3">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'" transform="translate(497.440391 188.595203)">保留最近 W 条</text>
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'" transform="translate(499.56 208.055594)">该层状态封顶</text>
   </g>
   <g id="text_4">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'" transform="translate(829.7 188.595203)">直接远程访问受限</text>
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'" transform="translate(829.7 208.082)">跨层可达仍需学习</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 14px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: start" x="39.24" y="274.176" transform="rotate(-0 39.24 274.176)">稀疏</text>
   </g>
   <g id="text_6">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="195.42" y="345.257703" transform="rotate(-0 195.42 345.257703)">学习或构造选择规则</text>
   </g>
   <g id="text_7">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'" transform="translate(493.058984 335.488406)">主注意力读 k 条</text>
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'" transform="translate(493.06 354.968094)">计入索引器工作</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'" transform="translate(823.2 335.475203)">遗漏条目会影响结果</text>
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'" transform="translate(829.7 354.948797)">历史存储未必减少</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 14px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: start" x="39.24" y="421.056" transform="rotate(-0 39.24 421.056)">线性递推</text>
   </g>
   <g id="text_10">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="195.42" y="492.1245" transform="rotate(-0 195.42 492.1245)">改变历史表示</text>
   </g>
   <g id="text_11">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'" transform="translate(473.56 482.349109)">固定矩阵中累积／修正</text>
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'" transform="translate(486.182188 501.881609)">状态容量与 n 无关</text>
   </g>
   <g id="text_12">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'" transform="translate(829.7 482.381609)">容量与干扰受约束</text>
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'" transform="translate(823.2 501.828797)">可混合显式历史读取</text>
   </g>
  </g>
  <g id="text_13">
   <text style="font-size: 21px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="540" y="30.72" transform="rotate(-0 540 30.72)">1.2 每次改造都要同时问收益与代价</text>
  </g>
  <g id="text_14">
   <text style="font-size: 11px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: start" x="43.2" y="590.58" transform="rotate(-0 43.2 590.58)">依据本章成本定义与第2—5章机制；不是性能或质量的优劣阶梯。</text>
  </g>
