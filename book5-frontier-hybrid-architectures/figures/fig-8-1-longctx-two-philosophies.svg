  <g id="text_13">
   <text style="font-size: 21px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="540" y="33.888" transform="rotate(-0 540 33.888)">8.1 长上下文：位置表示与历史存储两条设计轴</text>
