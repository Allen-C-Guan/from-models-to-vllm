  <g id="text_14">
   <text style="font-size: 11px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: start" x="43.2" y="743.436" transform="rotate(-0 43.2 743.436)">据本章机制归纳；两轴可组合，NoPE并不蕴含固定总存储。</text>
  </g>
