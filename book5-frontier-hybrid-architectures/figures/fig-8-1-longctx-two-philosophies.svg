    <text style="font-weight: 700; font-size: 14px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: start" x="39.24" y="150.9984" transform="rotate(-0 39.24 150.9984)">位置如何进入计算</text>
   </g>
   <g id="text_2">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'" transform="translate(235.705 208.5908)">显式旋转／嵌入</text>
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'" transform="translate(221.520781 226.835487)">RoPE、partial RoPE</text>
   </g>
   <g id="text_3">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'" transform="translate(750.415 208.6233)">或不加显式位置</text>
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'" transform="translate(717.915 228.096894)">因果、卷积、递推仍有顺序</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 14px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: start" x="39.24" y="289.6704" transform="rotate(-0 39.24 289.6704)">历史怎样保存</text>
   </g>
   <g id="text_5">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'" transform="translate(248.0875 347.106394)">逐token KV</text>
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'" transform="translate(235.705 366.7628)">窗口／压缩条目</text>
   </g>
   <g id="text_6">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'" transform="translate(750.415 347.289206)">或固定状态矩阵</text>
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'" transform="translate(763.213906 366.7628)">GDN／KDA</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 14px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: start" x="39.24" y="428.3424" transform="rotate(-0 39.24 428.3424)">在模型中组合</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="281.205" y="494.786988" transform="rotate(-0 281.205 494.786988)">Qwen：GDN + partial RoPE全局层</text>
   </g>
   <g id="text_9">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="795.915" y="495.755894" transform="rotate(-0 795.915 495.755894)">K3：KDA + NoPE全局MLA</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 14px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: start" x="39.24" y="567.0144" transform="rotate(-0 39.24 567.0144)">需要分别验证</text>
   </g>
   <g id="text_11">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="281.205" y="634.402503" transform="rotate(-0 281.205 634.402503)">位置与训练长度泛化</text>
   </g>
   <g id="text_12">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="795.915" y="634.3568" transform="rotate(-0 795.915 634.3568)">存储、检索与执行成本</text>
   </g>
