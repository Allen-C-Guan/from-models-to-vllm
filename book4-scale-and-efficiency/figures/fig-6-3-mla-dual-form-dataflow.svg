    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="315.72" y="123.416" transform="rotate(-0 315.72 123.416)">显式展开</text>
   </g>
   <g id="text_2">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="711.9" y="123.416" transform="rotate(-0 711.9 123.416)">潜空间计算</text>
   </g>
   <g id="text_3">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="315.72" y="215.586406" transform="rotate(-0 315.72 215.586406)">C (n,r) → K=C U_Kᵀ (n,dₕ)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="315.72" y="305.227094" transform="rotate(-0 315.72 305.227094)">s=Kq (n,)；加相同位置分数和遮罩</text>
   </g>
   <g id="text_5">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="315.72" y="395.298406" transform="rotate(-0 315.72 395.298406)">α=softmax(s/√(dₕ+dᴿ)) (n,)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="315.72" y="485.154406" transform="rotate(-0 315.72 485.154406)">V=C U_Vᵀ (n,dᵥ) → o=Vᵀα (dᵥ,)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="711.9" y="215.371094" transform="rotate(-0 711.9 215.371094)">q̂=U_Kᵀq (r,)；保持C (n,r)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="711.9" y="305.364203" transform="rotate(-0 711.9 305.364203)">s=Cq̂ (n,)；相同分数 → 相同α</text>
   </g>
   <g id="text_9">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="711.9" y="395.298406" transform="rotate(-0 711.9 395.298406)">ĉ=Cᵀα (r,)；每头各自混合一次</text>
   </g>
   <g id="text_10">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="711.9" y="485.154406" transform="rotate(-0 711.9 485.154406)">o=U_V ĉ (dᵥ,) → 相同输出</text>
   </g>
  </g>
  <g id="text_11">
   <text style="font-size: 21px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="504" y="31.44" transform="rotate(-0 504 31.44)">6.3 同一组权重，两种计算组织（单头）</text>
  </g>
  <g id="text_12">
   <text style="font-size: 10px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: start" x="50.4" y="631.8" transform="rotate(-0 50.4 631.8)">实数运算等价；r=d_c。归一化已经进入C；位置分数、遮罩和缩放必须相同。速度依赖执行形态与硬件。</text>
  </g>
