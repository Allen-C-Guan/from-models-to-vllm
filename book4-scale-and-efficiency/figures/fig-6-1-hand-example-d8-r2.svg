   <g id="text_1">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="226.44" y="123.437703" transform="rotate(-0 226.44 123.437703)">输入h (8,)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="628.2" y="123.464109" transform="rotate(-0 628.2 123.464109)">h=(1,2,1,2,1,2,1,2)；下投影分别累加奇数位与偶数位</text>
   </g>
   <g id="text_3">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="226.44" y="203.832812" transform="rotate(-0 226.44 203.832812)">状态c (2,)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="628.2" y="203.845" transform="rotate(-0 628.2 203.845)">c=(4,8)；读出映射只需这两项，不要求恢复原输入h</text>
   </g>
   <g id="text_5">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="226.44" y="284.213703" transform="rotate(-0 226.44 284.213703)">键读出K (8,)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="628.2" y="284.253312" transform="rotate(-0 628.2 284.253312)">行交替为(1/4,0)与(0,1/8) → K=(1,1,…,1)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="226.44" y="364.582406" transform="rotate(-0 226.44 364.582406)">值读出V (8,)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="628.2" y="364.641312" transform="rotate(-0 628.2 364.641312)">行交替为(1,0)与(0,−1) → V=(4,−8,…,4,−8)</text>
   </g>
   <g id="text_9">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="226.44" y="445.731109" transform="rotate(-0 226.44 445.731109)">位置支路边界</text>
   </g>
   <g id="text_10">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'" transform="translate(465.654297 435.830797)">旧三数例中的标量3仅用于存储演示，不能执行二维RoPE</text>
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'" transform="translate(513.520703 454.875797)">若另加2维位置键，则缓存4/16，省75%</text>
   </g>
  </g>
  <g id="text_11">
   <text style="font-size: 21px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle" x="504" y="30" transform="rotate(-0 504 30)">6.1 一份二维状态，两个不同的线性读出</text>
  </g>
  <g id="text_12">
   <text style="font-size: 10px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: start" x="50.4" y="561.6" transform="rotate(-0 50.4 561.6)">正文6.2构造例；固定低秩参数化的两种写法等价，不是将任意满秩模型无损压缩。</text>
  </g>
 </g>
