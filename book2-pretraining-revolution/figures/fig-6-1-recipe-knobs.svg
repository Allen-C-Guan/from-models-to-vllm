   <g id="text_1">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle; fill: #263b50" x="172.8" y="127.758797" transform="rotate(-0 172.8 127.758797)">数据</text>
   </g>
   <g id="text_2">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle; fill: #263b50" x="643.104" y="127.304812" transform="rotate(-0 643.104 127.304812)">报告语料：BERT约16GB → RoBERTa约160GB；来源与清理也改变</text>
   </g>
   <g id="text_3">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle; fill: #263b50" x="172.8" y="202.415797" transform="rotate(-0 172.8 202.415797)">批量</text>
   </g>
   <g id="text_4">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle; fill: #263b50" x="643.104" y="201.896813" transform="rotate(-0 643.104 201.896813)">序列批量256 → 8192；同时需要配套学习率与步数</text>
   </g>
   <g id="text_5">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle; fill: #263b50" x="172.8" y="277.001703" transform="rotate(-0 172.8 277.001703)">累计位置</text>
   </g>
   <g id="text_6">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle; fill: #263b50" x="643.104" y="276.363891" transform="rotate(-0 643.104 276.363891)">BERT实际128/512日程约42.6B → RoBERTa约2097B，约49.2倍</text>
   </g>
   <g id="text_7">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle; fill: #263b50" x="172.8" y="351.554094" transform="rotate(-0 172.8 351.554094)">掩码与句段</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle; fill: #263b50" x="643.104" y="351.431203" transform="rotate(-0 643.104 351.431203)">动态掩码、移除NSP及改变打包，需要分别辨认作用</text>
   </g>
   <g id="text_9">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle; fill: #263b50" x="172.8" y="426.14" transform="rotate(-0 172.8 426.14)">词表</text>
   </g>
   <g id="text_10">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle; fill: #263b50" x="643.104" y="425.672812" transform="rotate(-0 643.104 425.672812)">WordPiece约30k → 字节级BPE约50k；词表与参数量也变化</text>
   </g>
  </g>
  <g id="text_11">
   <text style="font-weight: 700; font-size: 21px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: start; fill: #263b50" x="40.32" y="34.56" transform="rotate(-0 40.32 34.56)">6.1 RoBERTa：主体相近，配方仍是多维变量</text>
  </g>
  <g id="text_12">
   <text style="font-size: 10px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: start; fill: #263b50" x="40.32" y="552.96" transform="rotate(-0 40.32 552.96)">BERT v2、RoBERTa v1；统一假定全长512时的16倍是另一口径，不等于实际日程倍率。</text>
  </g>
 </g>
