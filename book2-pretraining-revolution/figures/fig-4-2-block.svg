   <g id="text_3">
    <text style="font-size: 14px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle; fill: #263b50" x="504" y="259.676438" transform="rotate(-0 504 259.676438)">相加：U = X + Attention(LN₁(X))</text>
   </g>
   <g id="text_4">
    <text style="font-size: 14px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle; fill: #263b50" x="504" y="337.116781" transform="rotate(-0 504 337.116781)">LN₂ → 线性 d→4d → GELU → 线性 4d→d</text>
   </g>
   <g id="text_5">
    <text style="font-size: 14px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans'; text-anchor: middle; fill: #263b50" x="504" y="412.892438" transform="rotate(-0 504 412.892438)">相加：Y = U + FFN(LN₂(U))</text>
